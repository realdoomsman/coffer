[toolchain]
# Pin the Anchor version this source was written against. Build in WSL/CI (see README.md).
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Placeholder program id — run `anchor keys sync` after the first `anchor build`
# to replace this (and the declare_id! in programs/vault/src/lib.rs) with the
# real keypair-derived address.
vault = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
