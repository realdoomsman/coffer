<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0a0a08;
      margin: 0;
      padding: 20px;
      font-family: 'JetBrains Mono', monospace;
      color: #e9e6da;
      -webkit-font-smoothing: antialiased;
    }
    canvas {
      display: block;
      margin: 20px 0;
      max-width: 100%;
      background: #0a0a08;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .lbl {
      font-size: 11px;
      color: #9a968a;
      margin-top: 14px;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    .circ {
      border-radius: 50%;
    }
    .container {
      max-width: 1600px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="lbl">Profile Picture — 400×400</div>
    <canvas id="pfp" class="circ" width="400" height="400"></canvas>
    
    <div class="lbl">Banner — 1500×500</div>
    <canvas id="banner" width="1500" height="500"></canvas>
  </div>

  <script>
    // Exact colors from theme.css
    const COLORS = {
      ink: '#0a0a08',
      paper: '#0e0e0c',
      panel: '#121210',
      panel2: '#191916',
      panel3: '#21211d',
      line: '#262620',
      line2: '#38382f',
      lineBright: '#545447',
      text: '#e9e6da',
      muted: '#9a968a',
      dim: '#6b6759',
      amber: '#ffb000',
      amberDim: 'rgba(255, 176, 0, 0.12)',
      green: '#2fd980',
      red: '#ff4f58',
      blue: '#6fb3ff'
    };

    function drawGrid(ctx, width, height, color, pitch, size) {
      ctx.fillStyle = color;
      for (let y = pitch / 2; y < height; y += pitch) {
        for (let x = pitch / 2; x < width; x += pitch) {
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawTerminalBox(ctx, x, y, width, height, label, value, isHighlighted = false) {
      // Background
      ctx.fillStyle = COLORS.panel;
      ctx.fillRect(x, y, width, height);
      
      // Border
      ctx.strokeStyle = isHighlighted ? COLORS.amber : COLORS.line2;
      ctx.lineWidth = 1;
      ctx.strokeRect(x, y, width, height);

      // Label (top left)
      ctx.fillStyle = COLORS.dim;
      ctx.font = '600 11px "Space Mono", monospace';
      ctx.letterSpacing = '0.1em';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText(label.toUpperCase(), x + 12, y + 10);
      ctx.letterSpacing = '0px';

      // Value (centered or right-aligned)
      ctx.fillStyle = isHighlighted ? COLORS.amber : COLORS.text;
      ctx.font = value.includes('%') || value.includes('SOL') 
        ? '600 28px "JetBrains Mono", monospace'
        : '500 16px "Space Mono", monospace';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(value, x + width - 12, y + height / 2 + 2);
    }

    function drawPFP() {
      const canvas = document.getElementById('pfp');
      const ctx = canvas.getContext('2d');
      const size = 400;
      const center = size / 2;

      // Background with subtle grid
      ctx.fillStyle = COLORS.ink;
      ctx.fillRect(0, 0, size, size);
      drawGrid(ctx, size, size, COLORS.lineBright, 24, 1);

      // Outer ring - matches app borders
      ctx.strokeStyle = COLORS.line2;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(center, center, size / 2 - 4, 0, Math.PI * 2);
      ctx.stroke();

      // Inner glow ring
      ctx.strokeStyle = COLORS.amberDim;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(center, center, size / 2 - 12, 0, Math.PI * 2);
      ctx.stroke();

      // "C" mark - like sidebar branding
      // Dark box background
      const boxSize = 220;
      const boxX = center - boxSize / 2;
      const boxY = center - boxSize / 2;
      
      ctx.fillStyle = COLORS.panel;
      ctx.fillRect(boxX, boxY, boxSize, boxSize);
      ctx.strokeStyle = COLORS.line2;
      ctx.lineWidth = 1;
      ctx.strokeRect(boxX, boxY, boxSize, boxSize);

      // "C" letter
      ctx.fillStyle = COLORS.text;
      ctx.font = '700 120px "Space Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('C', center, center + 5);

      // Accent line
      ctx.fillStyle = COLORS.amber;
      ctx.fillRect(boxX + 12, boxY + 12, 24, 2);

      // Status indicator (like terminal status)
      ctx.fillStyle = COLORS.green;
      ctx.beginPath();
      ctx.arc(center + 70, center - 70, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBanner() {
      const canvas = document.getElementById('banner');
      const ctx = canvas.getContext('2d');
      const width = 1500;
      const height = 500;

      // Background
      ctx.fillStyle = COLORS.ink;
      ctx.fillRect(0, 0, width, height);
      drawGrid(ctx, width, height, COLORS.lineBright, 24, 1);

      // Left amber accent (avatar gutter)
      ctx.fillStyle = COLORS.amber;
      ctx.fillRect(0, 0, 4, height);

      // Safe area for content (avoid avatar overlap)
      const startX = 360;
      const startY = 80;

      // Header row - like terminal top bar
      ctx.fillStyle = COLORS.dim;
      ctx.font = '600 12px "Space Mono", monospace';
      ctx.letterSpacing = '0.2em';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText('COFFER // TRADER VAULTS ON SOLANA', startX, startY);
      ctx.letterSpacing = '0px';

      // Main headline - amber, uppercase, spaced
      let currentY = startY + 50;
      ctx.fillStyle = COLORS.amber;
      ctx.font = '700 64px "Space Mono", monospace';
      ctx.letterSpacing = '0.05em';
      ctx.fillText('BACK THE BEST TRADERS', startX, currentY);
      currentY += 75;

      // Subheadline
      ctx.fillStyle = COLORS.text;
      ctx.letterSpacing = '0.03em';
      ctx.fillText('THEY CAN NEVER RUN', startX, currentY);
      ctx.letterSpacing = '0px';
      currentY += 60;

      // Terminal-style boxes for key metrics (like your app UI)
      const boxes = [
        { label: 'Depositors', value: '70%', highlight: true },
        { label: 'Traders', value: '30%', highlight: false },
        { label: 'Custody', value: 'ON-CHAIN', highlight: true }
      ];

      const boxWidth = 140;
      const boxHeight = 70;
      const boxGap = 16;
      let boxX = startX;
      const boxY = currentY;

      boxes.forEach(box => {
        drawTerminalBox(ctx, boxX, boxY, boxWidth, boxHeight, box.label, box.value, box.highlight);
        boxX += boxWidth + boxGap;
      });

      // Right side - status and link
      const rightX = width - 280;
      
      // Status box
      drawTerminalBox(ctx, rightX, 120, 140, 50, 'Network', 'DEVNET', false);

      // URL
      ctx.fillStyle = COLORS.muted;
      ctx.font = '600 14px "Space Mono", monospace';
      ctx.letterSpacing = '0.1em';
      ctx.textAlign = 'right';
      ctx.fillText('coffer.fun', width - 60, startY);
      ctx.letterSpacing = '0px';

      // Small status indicator
      ctx.fillStyle = COLORS.green;
      ctx.beginPath();
      ctx.arc(rightX + 120, 145, 3, 0, Math.PI * 2);
      ctx.fill();

      // Bottom metadata line (like terminal footer)
      const footerY = height - 40;
      ctx.fillStyle = COLORS.dim;
      ctx.font = '500 11px "JetBrains Mono", monospace';
      ctx.textAlign = 'left';
      ctx.fillText(`Program: 8315nL9tGA3TdYC6jr2jRiB1ccDepRKdXpBVmNybtW2U`, startX, footerY);
      
      ctx.fillStyle = COLORS.line;
      ctx.fillRect(startX, footerY - 20, width - startX - 60, 1);
    }

    // Draw assets
    drawPFP();
    drawBanner();

    // Export commands
    console.log('=== EXPORT COMMANDS ===');
    console.log('PFP:', document.getElementById('pfp').toDataURL('image/png'));
    console.log('Banner:', document.getElementById('banner').toDataURL('image/png'));
  </script>
</body>
</html>
