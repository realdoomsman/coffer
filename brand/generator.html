<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: #1a1a18;
      margin: 0;
      padding: 20px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e9e6da;
    }
    canvas {
      display: block;
      margin: 20px 0;
      max-width: 100%;
      background: #0a0a08;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .lbl {
      font-size: 12px;
      color: #9a968a;
      margin-top: 14px;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .circ {
      border-radius: 50%;
    }
    .container {
      max-width: 1600px;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="lbl">Profile Picture — 400×400 (shown circular as X renders it)</div>
    <canvas id="pfp" class="circ" width="400" height="400"></canvas>
    
    <div class="lbl">Banner — 1500×500</div>
    <canvas id="banner" width="1500" height="500"></canvas>
  </div>

  <script>
    // Coffer color palette from theme.css
    const COLORS = {
      ink: '#0a0a08',
      paper: '#0e0e0c',
      panel: '#121210',
      line: '#262620',
      line2: '#38382f',
      lineBright: '#545447',
      text: '#e9e6da',
      muted: '#9a968a',
      dim: '#6b6759',
      amber: '#ffb000',
      amberDim: 'rgba(255, 176, 0, 0.12)',
      green: '#2fd980',
      red: '#ff4f58',
      blue: '#6fb3ff'
    };

    function drawDotGrid(ctx, width, height, color, pitch, size) {
      ctx.fillStyle = color;
      for (let y = pitch / 2; y < height; y += pitch) {
        for (let x = pitch / 2; x < width; x += pitch) {
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawPFP() {
      const canvas = document.getElementById('pfp');
      const ctx = canvas.getContext('2d');
      const size = 400;
      const center = size / 2;

      // Dark background
      ctx.fillStyle = COLORS.ink;
      ctx.fillRect(0, 0, size, size);

      // Subtle dot grid
      drawDotGrid(ctx, size, size, COLORS.lineBright, 20, 1);

      // Outer ring - line color
      ctx.strokeStyle = COLORS.line2;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(center, center, size / 2 - 8, 0, Math.PI * 2);
      ctx.stroke();

      // Inner ring - amber accent
      ctx.strokeStyle = COLORS.amber;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(center, center, size / 2 - 16, 0, Math.PI * 2);
      ctx.stroke();

      // "C" mark - clean, bold, centered
      ctx.fillStyle = COLORS.text;
      ctx.font = '700 180px "Space Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('C', center, center + 5);

      // Small accent dot
      ctx.fillStyle = COLORS.amber;
      ctx.beginPath();
      ctx.arc(center + 60, center - 60, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBanner() {
      const canvas = document.getElementById('banner');
      const ctx = canvas.getContext('2d');
      const width = 1500;
      const height = 500;

      // Dark background
      ctx.fillStyle = COLORS.ink;
      ctx.fillRect(0, 0, width, height);

      // Dot grid - subtle
      drawDotGrid(ctx, width, height, COLORS.lineBright, 24, 1);

      // Amber accent line on left - X avatar gutter
      ctx.fillStyle = COLORS.amber;
      ctx.fillRect(0, 0, 6, height);

      // Content area - avoid avatar overlap (avatar sits bottom-left, ~400px wide)
      // Safe area: x >= 340, y in 100-400 range
      const startX = 340;
      const startY = 100;
      let currentY = startY;

      // "TRADER VAULTS ON SOLANA" - muted, small, uppercase
      ctx.fillStyle = COLORS.muted;
      ctx.font = '600 18px "Space Mono", monospace';
      ctx.letterSpacing = '6px';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'top';
      ctx.fillText('TRADER VAULTS ON SOLANA', startX, currentY);
      ctx.letterSpacing = '0px';
      currentY += 50;

      // Main headline - bold, amber accent
      ctx.fillStyle = COLORS.amber;
      ctx.font = '700 72px "Space Mono", monospace';
      ctx.fillText('BACK THE BEST TRADERS.', startX, currentY);
      currentY += 80;

      // Second line - text color
      ctx.fillStyle = COLORS.text;
      ctx.fillText('THEY CAN NEVER RUN.', startX, currentY);
      currentY += 60;

      // Proof chips - clean boxes with line borders
      const chips = [
        { highlight: '70%', text: ' to depositors' },
        { highlight: 'Traders trade', text: ', they can\'t withdraw' },
        { highlight: 'On-chain', text: ' record, always verified' }
      ];

      let chipX = startX;
      const chipY = currentY + 10;
      const chipHeight = 40;

      chips.forEach(chip => {
        const highlightWidth = ctx.measureText(chip.highlight).width;
        const textWidth = ctx.measureText(chip.text).width;
        const totalWidth = highlightWidth + textWidth + 24;

        // Chip border
        ctx.strokeStyle = COLORS.line2;
        ctx.lineWidth = 1;
        ctx.strokeRect(chipX, chipY, totalWidth, chipHeight);

        // Highlight text
        ctx.fillStyle = COLORS.text;
        ctx.font = '600 17px "Inter", sans-serif';
        ctx.fillText(chip.highlight, chipX + 12, chipY + 12);

        // Regular text
        ctx.fillStyle = COLORS.muted;
        ctx.font = '500 17px "Inter", sans-serif';
        ctx.fillText(chip.text, chipX + 12 + highlightWidth, chipY + 12);

        chipX += totalWidth + 16;
      });

      // Right side - website and status
      ctx.fillStyle = COLORS.amber;
      ctx.font = '600 20px "Space Mono", monospace';
      ctx.letterSpacing = '2px';
      ctx.textAlign = 'right';
      ctx.fillText('coffer.fun', width - 60, 160);
      ctx.letterSpacing = '0px';

      // Status indicator
      ctx.fillStyle = COLORS.green;
      ctx.beginPath();
      ctx.arc(width - 60, 200, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = COLORS.muted;
      ctx.font = '500 16px "Inter", sans-serif';
      ctx.fillText('devnet live', width - 50, 205);
    }

    // Draw both assets
    drawPFP();
    drawBanner();

    // Log data URLs for saving
    console.log('PFP:', document.getElementById('pfp').toDataURL('image/png'));
    console.log('Banner:', document.getElementById('banner').toDataURL('image/png'));
  </script>
</body>
</html>
