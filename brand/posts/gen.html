// Post cards for @CofferFun. 1600x900 so X never has to upscale.
// Palette and ring geometry are taken from the profile picture, so a card
// in a timeline is recognisably the same brand as the avatar beside it.
const W = 1600, H = 900;
const INK = "#000000", GREY = "#3c3c3c", AMBER = "#f9a81b", GOLD = "#a87d22",
      TEXT = "#ffffff", MUTED = "#8c8c8c", LINE = "#2e2e2e",
      GREEN = "#2fd980", RED = "#ff4f58";
const BANDS = [[1,.82,GREY],[.82,.63,AMBER],[.63,.52,INK],[.52,.44,AMBER],[.44,.19,GOLD],[.19,0,INK]];

function rings(c, cx, cy, R, a) {
  c.save(); c.globalAlpha = a === undefined ? 1 : a;
  for (const b of BANDS) {
    c.beginPath(); c.arc(cx, cy, R * b[0], 0, 7);
    if (b[1] > 0) { c.moveTo(cx + R * b[1], cy); c.arc(cx, cy, R * b[1], 0, 7, true); }
    c.fillStyle = b[2]; c.fill("evenodd");
  }
  c.restore();
}

function frame(c, kicker) {
  c.fillStyle = INK; c.fillRect(0, 0, W, H);
  c.fillStyle = "rgba(255,255,255,.045)";
  for (let y = 16; y < H; y += 32) for (let x = 16; x < W; x += 32) { c.beginPath(); c.arc(x, y, 1.6, 0, 7); c.fill(); }
  c.fillStyle = AMBER; c.fillRect(0, 0, 11, H);
  rings(c, 1470, 120, 74, 1);
  c.font = '600 22px "IBM Plex Mono",monospace'; c.letterSpacing = '6px';
  c.fillStyle = AMBER; c.textAlign = 'left'; c.fillText(kicker, 74, 92); c.letterSpacing = '0px';
  c.font = '600 22px "IBM Plex Mono",monospace'; c.fillStyle = MUTED;
  c.fillText('coffer.fun', 74, H - 58);
}

function head(c, lines, y0, size) {
  size = size || 78;
  c.font = '700 ' + size + 'px "Space Mono",monospace'; c.textAlign = 'left';
  lines.forEach(function (l, i) { c.fillStyle = l[1] || TEXT; c.fillText(l[0], 74, y0 + i * (size + 16)); });
}

function body(c, lines, y0, size, color) {
  size = size || 27;
  c.font = '500 ' + size + 'px "IBM Plex Mono",monospace';
  c.fillStyle = color || MUTED; c.textAlign = 'left';
  lines.forEach(function (l, i) { c.fillText(l, 74, y0 + i * (size + 17)); });
}

function chip(c, x, y, label, val, col) {
  c.font = '600 25px "IBM Plex Mono",monospace';
  const w = c.measureText(label + '  ' + val).width + 44;
  c.strokeStyle = LINE; c.lineWidth = 1.5; c.strokeRect(x + .5, y + .5, w, 58);
  c.fillStyle = MUTED; c.fillText(label, x + 22, y + 38);
  const lw = c.measureText(label + '  ').width;
  c.fillStyle = col || TEXT; c.fillText(val, x + 22 + lw, y + 38);
  return x + w + 16;
}

// Real 1s candles, fetched live at render time.
async function candleCard(c) {
  frame(c, '1-SECOND CANDLES');
  head(c, [['REAL 1s BARS.', AMBER]], 200, 62);
  let rows = [];
  try {
    const r = await fetch('https://coffer.fun/api/ohlcv/9BB6NFEcjBCtnNLFko2FqVQBq8HHM13kCyYcdQbgpump?tf=1s');
    rows = (await r.json()).candles || [];
  } catch (e) { /* drawn as unavailable below */ }
  rows = rows.slice(-70);
  if (rows.length > 4) {
    const lo = Math.min.apply(null, rows.map(function (r) { return r.l; }));
    const hi = Math.max.apply(null, rows.map(function (r) { return r.h; }));
    const x0 = 74, y0 = 290, w = 1450, h = 420, sp = w / rows.length;
    const Y = function (v) { return y0 + h - ((v - lo) / (hi - lo || 1)) * h; };
    rows.forEach(function (r, i) {
      const cx = x0 + i * sp + sp / 2, up = r.c >= r.o;
      c.strokeStyle = up ? GREEN : RED; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(cx, Y(r.h)); c.lineTo(cx, Y(r.l)); c.stroke();
      c.fillStyle = up ? GREEN : RED;
      const t = Math.min(Y(r.o), Y(r.c)), bh = Math.max(2, Math.abs(Y(r.o) - Y(r.c)));
      c.fillRect(cx - sp * 0.32, t, sp * 0.64, bh);
    });
    body(c, [rows.length + ' one-second bars, live from pump.fun right now.',
             'Not contiguous: a bar exists only for a second that traded.'], 750, 25);
  } else {
    body(c, ['(no candles available at render time)'], 400);
  }
}

(async function () {
  const fonts = ['700 86px "Space Mono"', '700 27px "IBM Plex Mono"', '500 25px "IBM Plex Mono"'];
  for (const f of fonts) await document.fonts.load(f);
  await document.fonts.ready;
  const out = document.getElementById('out');
  const made = {};
  async function mk(name, fn) {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c = cv.getContext('2d');
    await fn(c);
    out.insertAdjacentHTML('beforeend', '<div class="n">' + name + '</div>');
    out.appendChild(cv);
    made[name] = cv.toDataURL('image/png');
  }
  for (const k of Object.keys(CARDS)) await mk(k, CARDS[k]);
  await mk('05-candles', candleCard);
  window.__cards = made;
  window.__ready = true;
})();
